<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate_JS_Course</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
            padding: 30px;
        }

        /* Search + Dropdown */
        #text,
        #myDropdown {
            height: 45px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
        }

        #text {
            width: 280px;
            padding: 0 14px;
            margin-right: 10px;
        }

        #myDropdown {
            width: 200px;
            padding: 0 12px;
            cursor: pointer;
        }

        #text:focus,
        #myDropdown:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        #text::placeholder {
            color: #9ca3af;
        }


        /* Product Container */
        #productContainer {
            margin-top: 30px;

            display: grid;
            grid-template-columns: repeat(auto-fill,
                    minmax(280px, 1fr));

            gap: 24px;
        }


        /* Product Card */
        .product-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px;

            box-shadow:
                0 4px 6px rgba(0, 0, 0, 0.03),
                0 10px 25px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;

            position: relative;
            overflow: hidden;
        }


        /* Card hover */
        .product-card:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 12px rgba(0, 0, 0, 0.05),
                0 20px 35px rgba(0, 0, 0, 0.08);
        }


        /* Brand */
        .product-brand {
            font-size: 13px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;

            margin-bottom: 8px;
        }


        /* Product Name */
        .product-card h2 {
            font-size: 21px;
            font-weight: 700;
            color: #111827;

            margin-bottom: 10px;

            line-height: 1.3;
        }


        /* Category */
        .product-category {
            display: inline-block;

            background: #eef2ff;
            color: #4f46e5;

            padding: 6px 11px;

            border-radius: 20px;

            font-size: 12px;
            font-weight: 600;

            margin-bottom: 15px;
        }


        /* Price */
        .product-price {
            font-size: 24px;
            font-weight: 800;

            color: #16a34a;

            margin: 8px 0 12px;
        }


        /* Rating */
        .product-rating {
            color: #f59e0b;

            font-size: 15px;
            font-weight: 600;

            margin-bottom: 15px;
        }


        /* Stock */
        .stock {
            font-size: 13px;
            font-weight: 700;

            display: inline-flex;
            align-items: center;

            padding: 6px 10px;

            border-radius: 6px;
        }

        .in-stock {
            color: #15803d;
            background: #dcfce7;
        }

        .out-stock {
            color: #b91c1c;
            background: #fee2e2;
        }


        /* Mobile Responsive */
        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            #text,
            #myDropdown {
                width: 100%;
                margin: 0 0 10px 0;
            }

            #productContainer {
                grid-template-columns: 1fr;
                gap: 16px;
                margin-top: 20px;
            }

            .product-card {
                padding: 18px;
            }
        }
    </style>
</head>
