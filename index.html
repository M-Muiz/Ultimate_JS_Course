<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate_JS_Course</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        #text {
            width: 300px;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        #text:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 5px rgba(79, 70, 229, 0.3);
        }

        #something {
            width: 300px;
            padding: 0;
            margin-top: 20px;
            list-style: none;
        }

        #something li {
            background-color: white;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
            font-size: 16px;
            color: #333;
        }
    </style>
</head>

<body style="background-color: rgb(41, 41, 41);">

    <input type="text" id="text">

    <ul id="something">
    </ul>
    <script src="app.js"></script>
</body>

</html>
